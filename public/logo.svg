<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="200" y1="100" x2="320" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="160" y1="180" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond carré arrondi moderne -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Anneau subtil d'interconnexion -->
  <circle cx="256" cy="256" r="190" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 12" opacity="0.35" />
  <circle cx="256" cy="256" r="140" stroke="#93c5fd" stroke-width="2" opacity="0.2" />

  <!-- 12 Étoiles Européennes -->
  <g fill="#fde047" opacity="0.9">
    <!-- 12 stars distributed in a circle at radius 190 -->
    <circle cx="256" cy="66" r="8" />
    <circle cx="351" cy="91" r="8" />
    <circle cx="420" cy="161" r="8" />
    <circle cx="446" cy="256" r="8" />
    <circle cx="420" cy="351" r="8" />
    <circle cx="351" cy="420" r="8" />
    <circle cx="256" cy="446" r="8" />
    <circle cx="161" cy="420" r="8" />
    <circle cx="91" cy="351" r="8" />
    <circle cx="66" cy="256" r="8" />
    <circle cx="91" cy="161" r="8" />
    <circle cx="161" cy="91" r="8" />
  </g>

  <!-- Feuille Verte Renouvelable (en arrière-plan du zigzag) -->
  <path d="M190 320 C170 230, 250 170, 340 170 C340 260, 270 340, 190 320 Z" fill="url(#leafGrad)" opacity="0.85" filter="url(#glow)" />
  <path d="M220 290 Q270 240 330 180" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" opacity="0.7" />

  <!-- Éclair Électrique Central (puissance & dynamisme) -->
  <path d="M290 86 L180 266 H276 L226 426 L346 236 H250 L290 86 Z" fill="url(#boltGrad)" stroke="#b45309" stroke-width="6" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Points nodaux d'interconnexion (villes / réseaux) -->
  <circle cx="180" cy="266" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="4" />
  <circle cx="346" cy="236" r="14" fill="#4ade80" stroke="#ffffff" stroke-width="4" />
  <circle cx="290" cy="86" r="12" fill="#facc15" stroke="#ffffff" stroke-width="3" />
  <circle cx="226" cy="426" r="12" fill="#f97316" stroke="#ffffff" stroke-width="3" />
</svg>
